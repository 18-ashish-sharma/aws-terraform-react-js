name: app

on:
  pull_request:
    branches: [main]
    paths: ["react-app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["react-app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    env:
      CI: "true" # tests run once (no watch) and lint warnings fail the build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: react-app/build
          retention-days: 7
